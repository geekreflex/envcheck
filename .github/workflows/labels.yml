name: Labels

# .github/labels.json is the source of truth for the repository's labels.
# This creates missing labels and updates colours and descriptions. It never
# deletes a label, so removing one from the file is a manual step.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write # labels are managed through the issues API

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const want = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const have = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100,
            });
            const byName = new Map(have.map((l) => [l.name.toLowerCase(), l]));

            for (const l of want) {
              const cur = byName.get(l.name.toLowerCase());
              if (!cur) {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
                core.info(`created  ${l.name}`);
              } else if (cur.name !== l.name || cur.color !== l.color || (cur.description || '') !== l.description) {
                await github.rest.issues.updateLabel({
                  ...context.repo,
                  name: cur.name,
                  new_name: l.name,
                  color: l.color,
                  description: l.description,
                });
                core.info(`updated  ${l.name}`);
              }
            }
