name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Makefile is the single source of truth for the linter version, so
      # `make lint` locally and CI can never drift apart.
      - name: Resolve pinned golangci-lint version
        id: golangci
        run: |
          version="$(sed -n 's/^GOLANGCI_VERSION := //p' Makefile)"
          test -n "$version" || { echo "GOLANGCI_VERSION not found in Makefile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}

      - name: go vet
        run: go vet ./...

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code --stat -- go.mod go.sum || {
            echo "go.mod/go.sum are stale. Run 'make tidy' and commit the result." >&2
            exit 1
          }

      - name: Verify dependencies
        run: go mod verify

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # CGO is left at its default: the race detector needs it on some
      # platforms. Release builds are static; tests are not.
      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          # Version metadata is derived from git describe.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build

      # A binary that cannot report its own version means the ldflags paths
      # have drifted from internal/buildinfo. Only checkable natively.
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/envcheck --help
          version="$(./dist/envcheck --version)"
          echo "$version"
          case "$version" in
            "envcheck dev"*)
              echo "version metadata was not injected by ldflags" >&2
              exit 1
              ;;
          esac

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Deliberately unpinned: a vulnerability scanner is only useful at the
      # latest version. This is the one tool we do not pin.
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Catch a broken .goreleaser.yaml on the PR that breaks it, not at the
      # moment someone is trying to ship a tag.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
